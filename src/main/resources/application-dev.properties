# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  DEVELOPMENT PROFILE  —  local docker-compose only                          ║
# ║  Activated by: SPRING_PROFILES_ACTIVE=dev  (set in your IDE run config)     ║
# ║  Do NOT commit real secrets here — these are safe local-only values         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── Database ──────────────────────────────────────────────────────────────────
# Matches docker-compose.yml postgres service
spring.datasource.url=jdbc:postgresql://localhost:5432/cvapp_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# update: Hibernate adjusts schema automatically as you change entities.
# Safe on a local DB you can always drop and recreate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────────────────────────
# Flyway and ddl-auto=update can conflict — disable Flyway locally and let
# Hibernate manage the schema. Re-enable when writing migration scripts.
spring.flyway.enabled=false

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-key-not-used-anywhere-else-aabbccddeeff00112233}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}


# ── Password reset / company invite ───────────────────────────────────────────
app.password-reset.expiration-hours=${PASSWORD_RESET_EXPIRATION_HOURS:1}
app.invite.expiration-hours=${INVITE_EXPIRATION_HOURS:48}

# ── Mail ──────────────────────────────────────────────────────────────────────
# Point at a local fake SMTP server (e.g. Mailpit on port 1025) so you never
# accidentally send real emails from your laptop.
# Run Mailpit: docker run -p 1025:1025 -p 8025:8025 axllent/mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev@local
spring.mail.password=unused
# Mailpit does not use TLS
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Frontend ──────────────────────────────────────────────────────────────────
app.frontend.url=http://localhost:5173

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
# Use your real Google dev credentials here — this file is .gitignored
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-dev-google-client-secret}

# ── Cloudinary ────────────────────────────────────────────────────────────────
# Use your real Cloudinary dev account — uploads go to a dev folder
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# ── Logging ───────────────────────────────────────────────────────────────────
# Full SQL and app debug output locally — never do this in prod
logging.level.com.best.cvapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG