# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PRODUCTION PROFILE                                                          ║
# ║  Activated by: SPRING_PROFILES_ACTIVE=prod  (set on the server)             ║
# ║  RULE: no hardcoded values here. Every secret comes from an env var.        ║
# ║  If an env var is missing the app refuses to start — that is intentional.   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP connection pool — tuned for a small VPS / free-tier cloud instance.
# Adjust pool size based on your DB plan's max_connections limit.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# validate: Hibernate checks that the DB schema matches your entities at startup
# and REFUSES TO START if they don't match. It will NEVER alter a live database.
# Schema changes must go through Flyway migrations only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
# Flyway will fail fast if migrations are out of order or missing — good.
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ── Frontend ──────────────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL}

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Logging ───────────────────────────────────────────────────────────────────
# WARN in production — only real problems get logged, never user data or SQL
logging.level.com.best.cvapp=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN