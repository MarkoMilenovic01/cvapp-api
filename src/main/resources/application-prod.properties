# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PRODUCTION PROFILE                                                        ║
# ║  Activated by: SPRING_PROFILES_ACTIVE=prod                                 ║
# ║  No secrets are hardcoded here. Secrets come from Render env variables.     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝


# ── Server / Render ───────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0


# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ── HikariCP ──────────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


# ── SQL init ──────────────────────────────────────────────────────────────────
spring.sql.init.mode=never


# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}


# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ── Frontend ──────────────────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL}


# ── Google OAuth2 ─────────────────────────────────────────────────────────────
app.oauth.google.client-id=${GOOGLE_CLIENT_ID}


# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ── Expiration Settings ───────────────────────────────────────────────────────
app.password-reset.expiration-hours=${PASSWORD_RESET_EXPIRATION_HOURS}
app.invite.expiration-hours=${INVITE_EXPIRATION_HOURS}


# ── Error responses ───────────────────────────────────────────────────────────
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never


# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.best.cvapp=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF


# ── Actuator / Health ─────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Do not let Gmail/SMTP decide if the app is healthy on Render Free
management.health.mail.enabled=false
